# 在 ~/.config/hypr/hyprland.conf 里 source 一次：
#
#   source = ~/workspace/desk/hypr/desk.conf
#
# 另外还要做三件事（这个文件管不了，得你自己改）：
#   1. 注释掉 exec-once = waybar        否则两条栏叠在一起
#   2. systemctl --user mask dunst.service
#      dunst 是 D-Bus 按需激活的，不 mask 的话它会抢走
#      org.freedesktop.Notifications，desk 的通知就收不到
#   3. ~/.config/hypr/hypridle.conf 里关屏那个 listener 的 on-resume
#      后面挂一句 `qs ... ipc call lock wake`：
#
#        listener {
#            timeout = 600
#            on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
#            on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' ; qs -p /home/yao/workspace/desk ipc call lock wake
#        }
#
#      屏幕黑着的时候按键照样送得进锁屏，于是「随便按一下叫醒屏幕」的那一下
#      会落进密码框，人看不见。这句话在点亮屏幕的同一拍把它清掉。
#      不加就是没加之前的样子，不会把人挡在外面 —— 来龙去脉见 core/LockState.qml 的 wake()。
#      休眠醒来那条（after_sleep_cmd）想一致的话同样挂一句。

# ── 模糊 ──────────────────────────────────────────────────
# 装一次就不用再碰：之后切不切玻璃主题只由 themes/*.json 的
# effect.opacity / effect.barOpacity 决定（为 1.0 时模糊不可见）。
#
# 用 ^desk$ 精确匹配：layerrule 的 namespace 是正则，
# 写成 desk 会连 desk-wallpaper（壁纸层）一起糊掉。
layerrule = blur, ^desk$
layerrule = ignorealpha 0.1, ^desk$
# popup 默认不吃上面那条 blur，要单独开
layerrule = blurpopups, ^desk$

# ── 自启动 ────────────────────────────────────────────────
# -n：已有同一份配置在跑就直接退出，避免起两份。
# 路径写死而不用 ~：不依赖 exec-once 是否经过 shell 展开。
exec-once = quickshell -n -p /home/yao/workspace/desk
